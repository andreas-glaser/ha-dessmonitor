name: Tests

on:
  push:
  pull_request:


permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Linting
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"
        with:
          # Released changelog sections are compared against their own tags.
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy homeassistant

      - name: "Lint with flake8"
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 custom_components/dessmonitor --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 custom_components/dessmonitor --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: "Check code formatting with Black"
        run: |
          black --check --diff custom_components/dessmonitor

      - name: "Check import sorting with isort"
        run: |
          isort --check-only --diff custom_components/dessmonitor

      - name: "Type checking with mypy"
        run: |
          # Exit 1 is a type warning and stays non-blocking. Anything else
          # means mypy did not run, which must not be reported as a pass.
          mypy custom_components/dessmonitor --ignore-missing-imports; status=$?
          if [ $status -gt 1 ]; then
            echo "mypy did not run (exit $status)"
            exit 1
          fi

      - name: "Check released changelog sections"
        run: |
          # Preparing a release leaves the published section where dev keeps
          # appending, so a later merge can file new entries under a shipped
          # tag without conflicting. Catch that before it reaches a release.
          python tools/check_changelog.py

      - name: "Installation check"
        run: |
          echo "Linting completed successfully - integration ready for installation"

  pytest:
    runs-on: ubuntu-latest
    name: Pytest
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "Install test dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: "Run pytest"
        run: |
          pytest --cov=custom_components/dessmonitor --cov-report=term-missing
