name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate version format
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: "Extract version"
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Extract from tag when triggered by tag push
            VERSION="${{ github.ref_name }}"
          else
            # Extract from workflow input when manually triggered
            VERSION="${{ github.event.inputs.version }}"
          fi
          
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          
          # Accept stable SemVer or this repository's release-candidate format.
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "Error: Version must use x.y.z or x.y.z-rc.N"
            exit 1
          fi

          if [[ "$VERSION" == *-rc.* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          # Workflow dispatch builds the default branch. RCs must instead be
          # tagged from a reviewed release branch, so that main remains on the
          # latest stable version.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$PRERELEASE" == "true" ]]; then
            echo "Error: Release candidates must be published by pushing their tag"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

  release:
    name: Prepare release
    runs-on: ubuntu-latest
    needs: validate-version
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: "Validate the changelog"
        shell: bash
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          # Requires a section for this version, and verifies that the sections
          # of earlier releases still match the tags that shipped them.
          python3 tools/check_changelog.py --require-version "$VERSION"

      - name: "Verify version files match the released version"
        shell: bash
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          INTEGRATION="${{ github.workspace }}/custom_components/dessmonitor"

          # The release is built from the tagged tree, so the committed files
          # must already state this version. Rewriting them here would publish
          # a ZIP that does not match its own tag.
          failed=0
          declared=$(cat VERSION)
          if [[ "$declared" != "$VERSION" ]]; then
            echo "Error: VERSION says $declared, tag says $VERSION"
            failed=1
          fi

          manifest=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["version"])' \
            "$INTEGRATION/manifest.json")
          if [[ "$manifest" != "$VERSION" ]]; then
            echo "Error: manifest.json says $manifest, tag says $VERSION"
            failed=1
          fi

          if ! grep -Fqx "VERSION: Final = \"$VERSION\"" "$INTEGRATION/const.py"; then
            echo "Error: const.py does not declare $VERSION"
            failed=1
          fi

          if [[ $failed -eq 1 ]]; then
            echo "Bump VERSION, manifest.json and const.py in the release"
            echo "commit and tag that commit. An RC tag is never moved or"
            echo "reused: publish the next rc.N. See docs/RELEASE_CANDIDATES.md."
            exit 1
          fi
          echo "Version files agree with the tag: $VERSION"

      - name: "Validate integration structure"
        shell: bash
        run: |
          # Ensure all required files exist
          REQUIRED_FILES=(
            "custom_components/dessmonitor/__init__.py"
            "custom_components/dessmonitor/manifest.json"
            "custom_components/dessmonitor/config_flow.py"
            "custom_components/dessmonitor/const.py"
            "custom_components/dessmonitor/sensor.py"
            "custom_components/dessmonitor/strings.json"
            "hacs.json"
            "README.md"
            "CHANGELOG.md"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Error: Required file missing: $file"
              exit 1
            fi
          done
          
          echo "✅ All required files present"

      - name: "Create integration ZIP"
        shell: bash
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          cd ${{ github.workspace }}/custom_components/dessmonitor
          
          # Create ZIP with version in filename
          zip -r "ha-dessmonitor-$VERSION.zip" . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x ".*" \
            -x "README.md"
          
          # Also create generic filename for HACS compatibility
          cp "ha-dessmonitor-$VERSION.zip" "ha-dessmonitor.zip"
          
          echo "Created release packages:"
          ls -la *.zip

      - name: "Generate release notes"
        shell: bash
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          
          # Extract changelog section for this version (until next heading)
          awk -v version="$VERSION" '
            $0 ~ /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" version "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "Error: Failed to extract changelog entry for version $VERSION"
            exit 1
          fi

          echo "Generated release notes:"
          cat release-notes.md

      - name: "Upload release assets"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ needs.validate-version.outputs.version }}"
          name: "Release v${{ needs.validate-version.outputs.version }}"
          body_path: release-notes.md
          files: |
            custom_components/dessmonitor/ha-dessmonitor-${{ needs.validate-version.outputs.version }}.zip
            custom_components/dessmonitor/ha-dessmonitor.zip
          draft: false
          prerelease: ${{ needs.validate-version.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
